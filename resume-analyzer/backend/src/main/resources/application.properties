server.port=8080
spring.application.name=resume-analyzer

# Database (override with environment variables; never commit real passwords)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_analyzer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Uploads (outside static folders)
app.storage.dir=${STORAGE_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# JWT (used from Phase 2; set a long random secret locally)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Optional: auto-create the first admin at startup (set both env vars)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Resume completeness score weights (should add up to 100)
app.scoring.contact=15
app.scoring.summary=10
app.scoring.education=15
app.scoring.skills=20
app.scoring.projects=15
app.scoring.experience=10
app.scoring.certifications=5
app.scoring.readability=10

spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Combined match score = required-weight * required coverage + (1 - required-weight) * preferred coverage
app.recommendation.required-weight=0.8
